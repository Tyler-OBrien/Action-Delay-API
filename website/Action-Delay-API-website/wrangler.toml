name = "action-delay-api-website"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2025-06-19"
account_id = "b9e510810e1e12fcd40826d266a1fb12"
compatibility_flags = [ "nodejs_compat" ]

[vars]
# adp-proxy's GraphQL endpoint, called server-side from /api/compare. Keeping it
# server-side is why the endpoint needs no CORS handling.
#
# Same host as the REST API: nginx routes only /graphql to adp-proxy on
# 127.0.0.1:8124, and everything else on that host stays the .NET API.
#
# These vars are loaded in `astro dev` too, so this value would otherwise be
# unconditional — set ADP_GRAPHQL_URL in .env to point dev at a local proxy
# (see .env.example).
ADP_GRAPHQL_URL = "https://delay.cloudflare.chaika.me/api/internal/graphql"

[assets]
binding = "ASSETS"
directory = "./dist/client"

[observability]
enabled = true

[observability.traces]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
